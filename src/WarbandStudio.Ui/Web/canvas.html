  sel.innerHTML = '';
  const opt = (v, t) => { const o = document.createElement('option'); o.value = v; o.textContent = t; return o; };
  if (src.length === 0) opt('', '（没有其他已加载的包）');
  for (const p of src) sel.appendChild(opt(p.pack, p.name + '（' + (p.tabs || []).length + ' 个页签）'));
  if (src.length > 0) sel.value = src[0].pack;      // 默认选第一个来源包（离线 DOM 桩不会自动选第一项）
  const draw = () => {
    const host = document.getElementById('impList');
    host.innerHTML = '';
    const p = src.find(x => x.pack === sel.value);
    if (!p) return;
    for (const t of (p.tabs || [])) {
      const lab = document.createElement('label');
      lab.style.cssText = 'display:inline-flex;align-items:center;gap:3px;margin:0 8px 4px 0;color:#B0B6BC';
      const cb = document.createElement('input');
      cb.type = 'checkbox'; cb.value = t;
      lab.appendChild(cb);
      const sp = document.createElement('span');      // 命名文本用 span（离线 DOM 桩没有 createTextNode）
      sp.textContent = t;
      lab.appendChild(sp);
      host.appendChild(lab);
    }
  };
  sel.onchange = draw;
  draw();
  showPop('impPop');
}
document.getElementById('impClose').onclick = () => hidePop('impPop');
document.getElementById('impOk').onclick = () => {
  const pack = document.getElementById('impPack').value;
  // 收集勾选的页签：直接遍历（不用 `:checked` 选择器，离线 DOM 桩不支持伪类）
  const keys = [];
  for (const lab of Array.from(document.getElementById('impList').children))
    for (const cb of Array.from(lab.children)) if (cb.tagName === 'input' && cb.checked) keys.push(cb.value);
  if (pack && keys.length > 0) report({ type: 'importTab', pack: pack, keys: keys });
  hidePop('impPop');
};
document.getElementById('tmScope').onclick = () => {
  const host = document.getElementById('tmRow2');
  host.innerHTML = '';
  const cur = ((DATA.tabRaceScopes || {})[tmCategory] || []);

    lab.title = r.r;

document.getElementById('tmScopeCancel').onclick = () => {
  document.getElementById('tmRow2').style.display = 'none';
  document.getElementById('tmRow3').style.display = 'none';
  document.getElementById('tmRow1').style.display = '';
};
document.getElementById('tmScopeOk').onclick = () => {

  for (const cb of document.querySelectorAll('#tmRow2 input[type=checkbox]')) if (cb.checked) races.push(cb.value);
  report({ type: 'applyTabToRaces', category: tmCategory, races: races });

/* ───────────── 鼠标 ───────────── */
addEventListener('mousemove', e => {
  if (panning) {
    pan.x = panning.px + (e.clientX - panning.sx);
    pan.y = panning.py + (e.clientY - panning.sy);
    applyPan();
    return;
  }
  if (band) {
    const b = document.getElementById('band');
    const x = Math.min(band.sx, e.clientX), y = Math.min(band.sy, e.clientY);
    b.style.left = x + 'px'; b.style.top = y + 'px';
    b.style.width = Math.abs(e.clientX - band.sx) + 'px';
    b.style.height = Math.abs(e.clientY - band.sy) + 'px';
    return;
  }
  if (drag) {
    // 真的动了才算"拖动"：没有这一步，mouseup 里的"回报坐标"分支永远不成立 ——
    // 表现就是"拖了坐标不落表，下一次重推画布（加兵/撤销等）又弹回原位"。
    // 防误触：按下后 ~0.2 秒内的位移**不算拖动**（点选兵牌时手抖常带出几像素位移，用户实测）；之后照旧 2px 阈值
    if (!drag.moved && (Math.abs(e.clientX - drag.sx) > 2 || Math.abs(e.clientY - drag.sy) > 2)
        && Date.now() - (drag.t0 || 0) >= 200) drag.moved = true;
    // Shift = 精调（位移打 0.25 折）。必须**增量**累加：中途按下/松开 Shift 若整段重算，兵牌会被拽回起点
    const slow = e.shiftKey ? 0.25 : 1;
    const stepX = (e.clientX - drag.lastX) / zoom * slow, stepY = (e.clientY - drag.lastY) / zoom * slow;
    drag.lastX = e.clientX; drag.lastY = e.clientY;
    drag.curX = (drag.curX ?? drag.x) + stepX;
    drag.curY = (drag.curY ?? drag.y) + stepY;
    const nx = drag.curX, ny = drag.curY;
    if (drag.groups && drag.groups.length > 1) {
      // 多选：整批按同一个位移走（之前只动了被点住的那个组）
      const dx = drag.curX - drag.x, dy = drag.curY - drag.y;   // 用增量结果（上面已按 Shift 速度算好）
      for (const it of drag.groups) {
        const pair = snapPair(it.x + dx, it.y + dy);
        const gx2 = pair[0], gy2 = pair[1];
        const gg = GROUPS[it.k]; if (!gg) continue;
        gg.x = gx2; gg.y = gy2;
        (CARDSBYGROUP[it.k] || []).forEach((el2, k2) => {
          el2.style.left = (gx2 + k2 * SLOT) + 'px'; el2.style.top = gy2 + 'px';
        });
        redrawLinksFor(it.k);
      }
      livePos(drag.g);
      document.getElementById('xy').textContent =
        '拖动中（' + drag.groups.length + ' 个组一起）' + (snapOn ? '　吸附 50 网格' : '');
    } else {
      // 组是绑在一起的：同组的所有牌一起走
      const pair0 = snapPair(nx - drag.i * SLOT, ny);
      const sx2 = pair0[0], sy2 = pair0[1];
      (CARDSBYGROUP[drag.g] || [drag.el]).forEach((el, k) => {
        el.style.left = (sx2 + k * SLOT) + 'px';
        el.style.top = sy2 + 'px';
      });
      const g = GROUPS[drag.g];
      if (g) { g.x = sx2; g.y = sy2; redrawLinksFor(drag.g); livePos(drag.g); }
    }
    {   // 状态栏也显示**吸完的组坐标**（和落表的一致），不然读到的数和实际落的不一样
      const gg0 = GROUPS[drag.g];
      const px = gg0 ? gg0.x : nx, py = gg0 ? gg0.y : ny;
      document.getElementById('xy').textContent =
        '拖动中 游戏坐标 (' + Math.round(px) + ', ' + Math.round(py) + ')  →  面板像素 (' +
        Math.round(px + 316) + ', ' + Math.round(py + 43) + ')　缩放 ' + Math.round(zoom * 100) + '%' +
        (snapOn ? '　吸附 50 网格' : '');
    }
  } else {
    const t = document.getElementById('tree').getBoundingClientRect();
    document.getElementById('xy').textContent =
      '鼠标 游戏坐标 (' + Math.round((e.clientX - t.left) / zoom) + ', ' + Math.round((e.clientY - t.top) / zoom) + ')' +
      (pan.x || pan.y || zoom !== 1 ? '　画面偏移 (' + Math.round(pan.x) + ', ' + Math.round(pan.y) + ') 缩放 ' + Math.round(zoom * 100) + '%' : '');
  }
});
addEventListener('mouseup', e => {
  if (panning) { panning = null; return; }
  if (band) {
    const b = document.getElementById('band');
    b.style.display = 'none';
    const x1 = Math.min(band.sx, e.clientX), y1 = Math.min(band.sy, e.clientY);
    const x2 = Math.max(band.sx, e.clientX), y2 = Math.max(band.sy, e.clientY);
    band = null;
    if (x2 - x1 <= 6 && y2 - y1 <= 6) {
      // 画布空白处**单击**（不是拖框）→ 取消所有选择（页签栏/浮动面板不在此列，按下时已排除）
      multiGroups = []; selected = null; connectFrom = null; linkSel = null;
      for (const el of document.querySelectorAll('#tree .card'))
        el.classList.remove('sel', 'msel', 'dimmed', 'upnext', 'conn');
      for (const L of LINKELS) L.el.classList.remove('sel');
      linkSel = null; hideKnob();                   // 反选：连线的高亮和转点手柄一起收
      hidePop('cardPop'); hidePop('multiPop'); hidePop('routePop');
      document.getElementById('ctxMenu').classList.add('hidden');
      drag = null; band = null;                     // 反选要把拖动/框选状态一起清掉（不然防误触/拖动状态会残留到下一次）
      paintMulti();
      report({ type: 'deselect' });
      return;
    }
    if (x2 - x1 > 6 || y2 - y1 > 6) {                      // 框太小当点击处理
      for (const el of document.querySelectorAll('#tree .card')) {
        if (el.style.display === 'none' || el.dataset.empty === '1') continue;
        const r = el.getBoundingClientRect();
        // 只要**部分**落在框里就算（之前要求完全框住，太难选）
        if (r.left < x2 && r.right > x1 && r.top < y2 && r.bottom > y1)
          addMulti(el.dataset.group);
      }
      report({ type: 'band', count: multi.length });
    }
    paintMulti();
    return;
  }
  if (drag && drag.moved && drag.groups && drag.groups.length > 1) {
    // 多选整批拖动：**一条消息**带全部组（后端一次落完再统一重推画布，避免多次重绘）
    const moved = [];
    for (const it of drag.groups) {
      const gg = GROUPS[it.k]; if (!gg) continue;
      moved.push({ group: it.k, x: Math.round(gg.x), y: Math.round(gg.y) });
    }
    if (moved.length > 0) report({ type: 'moveMany', groups: moved });
    document.getElementById('xy').textContent = '已移动 ' + moved.length + ' 个组（已应用，待导出）';
    refreshCardPanel();            // 坐标框立刻显示新坐标（拖动即应用，不用再点"应用坐标"）
    drag = null;
    return;
  }
  if (drag && drag.moved) {
    // **上报画布上真正的坐标**（GROUPS[k].x/y，mousemove 里已经按吸附吸过），
    // 而不是指针累加的 drag.curX/curY —— 否则"吸附拖到顶点、一松手又跳回非顶点"（模型里存的是原始值）。
    const gg1 = GROUPS[drag.g];
    const gx = gg1 ? Math.round(gg1.x) : Math.round((drag.curX ?? drag.x) - drag.i * SLOT);
    const gy = gg1 ? Math.round(gg1.y) : Math.round(drag.curY ?? drag.y);
    report({ type: 'move', group: drag.g, unit: drag.el.title.split(' ')[0], x: gx, y: gy });
    document.getElementById('xy').textContent =
      '组「' + drag.g + '」→ 游戏坐标 (' + gx + ', ' + gy + ')　（已应用：拖动即生效，导出时写入；不用再点「应用坐标」）';
    refreshCardPanel();            // 坐标框立刻同步（避免"框里是旧值 → 点应用坐标把旧值写回去"）
  }
  if (drag) drag.el.draggable = false;
  drag = null;
});
addEventListener('mousedown', e => {
  if (e.button === 1) {
    panning = { sx: e.clientX, sy: e.clientY, px: pan.x, py: pan.y };
    e.preventDefault();
    return;
  }
  if (e.button !== 0 || e.target.closest('.card, #rail, .pop, #bar, #linkKnob')) return;
  // 空白处按下 → 框选（松开时把框到的兵卡加入多选）
  band = { sx: e.clientX, sy: e.clientY };
  const b = document.getElementById('band');
  b.style.display = 'block';
  b.style.left = e.clientX + 'px'; b.style.top = e.clientY + 'px';
  b.style.width = '0px'; b.style.height = '0px';
  if (!e.ctrlKey && !e.metaKey) { multi = []; paintMulti(); }
});
addEventListener('auxclick', e => { if (e.button === 1) e.preventDefault(); });
addEventListener('keydown', e => {
  // **焦点在输入框里就别抢键**：多选面板的 X/Y、成本/搜索等输入框里按 Backspace、方向键是在编辑文字，
  // 不能被当成"删除选中的组 / 微调坐标"（用户实测：多选编辑共同坐标时按退格，兵牌直接被删）
  const t = e.target;
  if (t && (t.tagName === 'INPUT' || t.tagName === 'TEXTAREA' || t.tagName === 'SELECT' || t.isContentEditable)) return;
  // —— 常规快捷键（画布有焦点时） ——
  // 删除选中的组
  if (e.key === 'Delete' || e.key === 'Backspace') {
    if (multiGroups.length > 0) {
      e.preventDefault();
      for (const gk of multiGroups.slice()) report({ type: 'removeGroup', group: gk });
      multiGroups = []; paintMulti();
    }
    return;
  }
  // 方向键微调 1px（Shift = 10px）
  if (e.key.startsWith('Arrow') && multiGroups.length > 0 && !e.ctrlKey && !e.altKey) {
    e.preventDefault();
    const step = e.shiftKey ? 10 : 1;
    const dx = e.key === 'ArrowLeft' ? -step : e.key === 'ArrowRight' ? step : 0;
    const dy = e.key === 'ArrowUp' ? -step : e.key === 'ArrowDown' ? step : 0;
    for (const gk of multiGroups) {
      const gg = GROUPS[gk]; if (!gg) continue;
      report({ type: 'setPos', group: gk, x: Math.round(gg.x + dx), y: Math.round(gg.y + dy) });
    }
    return;
  }
  // Ctrl+G 合并 / Ctrl+Shift+G 拆组
  if ((e.ctrlKey || e.metaKey) && (e.key === 'g' || e.key === 'G')) {
    e.preventDefault();
    if (multiGroups.length >= 2) {
      report({ type: 'mergeGroups', keep: multiGroups[0], drop: multiGroups[1] });
      multiGroups = []; paintMulti();
    } else if (multiGroups.length === 1) {
      report({ type: 'splitGroup', group: multiGroups[0], x: GROUPS[multiGroups[0]] ? GROUPS[multiGroups[0]].x : 0,
               y: GROUPS[multiGroups[0]] ? GROUPS[multiGroups[0]].y : 0, category: activePage || '' });
      multiGroups = []; paintMulti();
    }
    return;
  }
  // L：用选中的两个组直接建链接（弹升级对话框）
  if ((e.key === 'l' || e.key === 'L') && !e.ctrlKey && !e.metaKey && multiGroups.length === 2) {
    e.preventDefault();
    const A = GROUPS[multiGroups[0]], B = GROUPS[multiGroups[1]];
    const pos = positionsFor(A, B);
    routeDialog('新建升级', { base: multiGroups[0], target: multiGroups[1], key: '',
                              cost: (DATA.costKeys || [])[0] ? ((DATA.costKeys || [])[0].k || '') : '', rank: 2, sub: 0,
                              childPos: pos.childPos, parentPos: pos.parentPos,
                              routeOnly: crossPagePair(multiGroups[0], multiGroups[1]) });
    return;
  }
  // Ctrl+S 保存 / Ctrl+Shift+S 另存为；Ctrl+Tab 切画布
  if ((e.ctrlKey || e.metaKey) && (e.key === 's' || e.key === 'S')) {
    e.preventDefault(); report({ type: 'hotkey', key: e.shiftKey ? 'saveAs' : 'save' }); return;
  }
  if (e.ctrlKey && e.key === 'Tab') {
    e.preventDefault(); report({ type: 'hotkey', key: e.shiftKey ? 'prevTab' : 'nextTab' }); return;
  }
  // Ctrl+Z 撤销 / Ctrl+Y（或 Ctrl+Shift+Z）重做
  if ((e.ctrlKey || e.metaKey) && (e.key === 'z' || e.key === 'Z')) {
    e.preventDefault(); report({ type: e.shiftKey ? 'redo' : 'undo' }); return;
  }
  if ((e.ctrlKey || e.metaKey) && (e.key === 'y' || e.key === 'Y')) {
    e.preventDefault(); report({ type: 'redo' }); return;
  }
  if (e.key === 'a' && (e.ctrlKey || e.metaKey)) {          // Ctrl+A：选中当前页面上可见的兵卡
    e.preventDefault();
    multiGroups = [];
    for (const el of document.querySelectorAll('#tree .card')) {
      if (el.style.display === 'none') continue;
      addMulti(el.dataset.group);
    }
    paintMulti();
    report({ type: 'selectAll', groups: multiGroups.length });
    return;
  }
  if (e.key === '0' && !e.ctrlKey && !e.altKey) resetPan();
  if (e.key === 'Escape') {
    hidePop('cardPop'); hidePop('routePop'); hidePop('multiPop'); hidePop('newPop'); hidePop('openPop'); hidePop('upgPop');
    hidePop('linePop'); lineCur = null;
    const cm = document.getElementById('ctxMenu'); if (cm) cm.classList.add('hidden');
    const sm = document.getElementById('snapMenu'); if (sm) sm.style.display = 'none';
    multiGroups = []; selected = null; connectFrom = null; linkSel = null;
    for (const el of document.querySelectorAll('#tree .card')) el.classList.remove('sel','msel','dimmed','upnext','conn');
    for (const L of LINKELS) L.el.classList.remove('sel');
    paintMulti();
  }
});
</script>
